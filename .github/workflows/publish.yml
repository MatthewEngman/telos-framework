# Manual PyPI release. Add repository secret PYPI_API_TOKEN before running.
name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telos-framework

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telos-framework/pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: telos-framework/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
