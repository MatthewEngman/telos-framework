# Publish telos-os to PyPI (manual).
#
# Recommended: PyPI "Trusted publishing" (OIDC) — no long-lived token in GitHub.
#   1. Create https://pypi.org account (and optionally https://test.pypi.org).
#   2. On PyPI: your account → Publishers → add GitHub workflow:
#      repo: MatthewEngman/telos-framework, workflow file: publish.yml (this file).
#      If using a GitHub Environment: set the same name in PyPI (Trusted Publisher) and in `environment:` below.
#   3. Bump version in telos-framework/pyproject.toml (and telos/__init__.py if you keep them in sync).
#   4. Run this workflow from the Actions tab.
#
# Alternative: set repository secret PYPI_API_TOKEN and uncomment the `with: password:` block below
# (and remove or ignore OIDC — the action prefers trusted publishing when configured on PyPI).

name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the optional "Environment name" on PyPI Trusted Publisher (and GitHub → Environments).
    environment: pypi
    defaults:
      run:
        working-directory: telos-framework

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telos-framework/pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: telos-framework/dist/
          # password: ${{ secrets.PYPI_API_TOKEN }}  # only if not using Trusted publishing
