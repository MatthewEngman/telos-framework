# Ensure telos-framework/templates/index.json matches generate_templates_index.py output.
# (Direct pushes to main by GITHUB_TOKEN are blocked when rules require PRs — verify instead.)
# For Lovable / static hub: fetch raw JSON from main (e.g. GitHub raw URL).

name: Templates catalog

on:
  push:
    branches: [main, master]
    paths:
      - "telos-framework/templates/**/*.telos"
      - "telos-framework/scripts/generate_templates_index.py"
      - "telos-framework/templates/index.json"
  pull_request:
    branches: [main, master]
    paths:
      - "telos-framework/templates/**/*.telos"
      - "telos-framework/scripts/generate_templates_index.py"
      - "telos-framework/templates/index.json"

permissions:
  contents: read

concurrency:
  group: templates-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telos-framework/pyproject.toml

      - name: Install telos-framework
        working-directory: telos-framework
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Verify templates/index.json is current
        working-directory: telos-framework
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/generate_templates_index.py --dry-run > /tmp/templates-index-expected.json
          if ! diff -q templates/index.json /tmp/templates-index-expected.json; then
            echo "::error::telos-framework/templates/index.json is out of date. From repo root: cd telos-framework && python scripts/generate_templates_index.py — then commit the result in the same PR as template changes."
            diff -u templates/index.json /tmp/templates-index-expected.json || true
            exit 1
          fi
          echo "Templates index matches generator output."
