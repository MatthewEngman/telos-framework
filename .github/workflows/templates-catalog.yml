# Regenerate telos-framework/templates/index.json when curated .telos files change.
# For Lovable / static hub: fetch raw JSON from main (e.g. GitHub raw URL).

name: Templates catalog

on:
  push:
    branches: [main, master]
    paths:
      - "telos-framework/templates/**/*.telos"
      - "telos-framework/scripts/generate_templates_index.py"

permissions:
  contents: write

concurrency:
  group: templates-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telos-framework/pyproject.toml

      - name: Install telos-framework
        working-directory: telos-framework
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Regenerate templates index
        working-directory: telos-framework
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_templates_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telos-framework/templates/index.json
          if git diff --staged --quiet; then
            echo "No index changes."
          else
            git commit -m "chore(templates): regenerate templates/index.json"
            git push
          fi
