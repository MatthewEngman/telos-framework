# On release tags (v*), notify the Actuator Hub to update the displayed telos-os version.
# Requires repo secret HUB_WEBHOOK_SECRET (same value as VERSION_WEBHOOK_SECRET on Supabase).

name: Update Hub Version

on:
  push:
    tags: ["v*"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Actuator Hub
        run: |
          curl -fsS -X POST \
            "https://uisorzinksqqhaopknsa.supabase.co/functions/v1/update-version" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.HUB_WEBHOOK_SECRET }}" \
            -d "{\"version\": \"${{ steps.version.outputs.VERSION }}\"}"
