[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telos-os"
version = "1.2.0"
description = "Declarative MILP runtimes: .telos manifests, safe linear/memory expression parsers, PuLP/CBC, actuators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Telos contributors" }]
keywords = ["optimization", "MILP", "infrastructure", "telos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy",
  "scipy",
  "sympy",
  "pydantic>=2",
  "pulp",
  "pyyaml",
  "openai",
]

[project.optional-dependencies]
docker = ["docker"]
kubernetes = ["kubernetes"]
server = ["fastapi", "uvicorn[standard]", "websockets"]
dev = ["pytest>=7", "hypothesis>=6.100"]
all = ["docker", "kubernetes", "fastapi", "uvicorn[standard]", "websockets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
telos = "telos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telos*"]
